# ========================
# MINIO CONFIGURATION
# ========================
minio.url=http://localhost:9000
minio.access-key=admin
minio.secret-key=admin123
minio.bucket=gabinetes
minio.region=us-east-1

# ========================
# DATABASE
# ========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/ecommerce_gabinetes

quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.initial-size=5
quarkus.datasource.jdbc.max-wait=30s

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# ========================
# JWT
# ========================
mp.jwt.verify.issuer=unitins-jwt
mp.jwt.verify.publickey.location=token/publicKey.pem
smallrye.jwt.sign.key.location=token/privateKey.pem

# ========================
# CORS
# ========================
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,authorization
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# ========================
# SECURITY
# ========================
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.paths=/gabinetes*,/auth/*,/public/*,/favicon.ico,/api/files/*

quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.authenticated.paths=/api/*,/*

# Permite acesso ao Swagger UI sem autenticação
quarkus.http.auth.permission.swagger.paths=/q/swagger-ui/*
quarkus.http.auth.permission.swagger.policy=permit

# --- Liberar OpenAPI JSON (necessário para o Swagger funcionar) ---
quarkus.http.auth.permission.openapi.paths=/q/openapi
quarkus.http.auth.permission.openapi.policy=permit